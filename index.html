<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLP Course Notes - University of Padova</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            color: white;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        }

        .sidebar-header {
            padding: 30px 20px;
            background: rgba(0, 0, 0, 0.2);
        }

        .sidebar-header h1 {
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .sidebar-header .subtitle {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .nav-section {
            padding: 20px;
        }

        .nav-section h3 {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            opacity: 0.8;
        }

        .nav-section ul {
            list-style: none;
            margin-bottom: 20px;
        }

        .nav-section li {
            margin: 3px 0;
        }

        .nav-section a {
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            display: block;
            border-radius: 6px;
            font-size: 0.9em;
            transition: background 0.2s;
        }

        .nav-section a:hover,
        .nav-section a.active {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Main content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .topbar {
            background: white;
            border-bottom: 1px solid #e0e0e0;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: #667eea;
        }

        .breadcrumb {
            color: #666;
            font-size: 0.9em;
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            background: #fafafa;
        }

        .content {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        /* Markdown content styling */
        .content h1 {
            color: #667eea;
            margin: 30px 0 20px 0;
            font-size: 2.2em;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }

        .content h1:first-child {
            margin-top: 0;
        }

        .content h2 {
            color: #667eea;
            margin: 25px 0 15px 0;
            font-size: 1.7em;
        }

        .content h3 {
            color: #764ba2;
            margin: 20px 0 12px 0;
            font-size: 1.3em;
        }

        .content p {
            margin: 15px 0;
            line-height: 1.7;
        }

        .content ul, .content ol {
            margin: 15px 0;
            padding-left: 30px;
        }

        .content li {
            margin: 8px 0;
        }

        .content code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9em;
        }

        .content pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 20px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 20px 0;
        }

        .content pre code {
            background: none;
            padding: 0;
            color: inherit;
        }

        .content blockquote {
            border-left: 4px solid #667eea;
            margin: 20px 0;
            padding: 15px 20px;
            background: #f8f9fa;
            border-radius: 0 4px 4px 0;
        }

        .content table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .content th, .content td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        .content th {
            background: #667eea;
            color: white;
            font-weight: 600;
        }

        .content a {
            color: #667eea;
            text-decoration: none;
        }

        .content a:hover {
            text-decoration: underline;
        }

        .content img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin: 20px 0;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -300px;
                height: 100%;
                z-index: 1000;
                transition: left 0.3s;
            }

            .sidebar.open {
                left: 0;
            }

            .menu-toggle {
                display: block;
            }

            .content-area {
                padding: 20px;
            }

            .content {
                padding: 20px;
            }
        }

        /* Home page specific styling */
        .home-intro {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            border-radius: 8px;
            margin-bottom: 30px;
            text-align: center;
        }

        .home-intro h1 {
            color: white !important;
            border: none !important;
            margin: 0 0 10px 0 !important;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .info-card {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .info-card h3 {
            color: #667eea !important;
            margin-top: 0 !important;
        }
    </style>
</head>
<body>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1>NLP Notes</h1>
            <div class="subtitle">University of Padova</div>
        </div>
        <div class="nav-section" id="navigation">
            <!-- Navigation will be populated by JavaScript -->
        </div>
    </nav>

    <div class="main-content">
        <div class="topbar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="breadcrumb" id="breadcrumb">Natural Language Processing</div>
        </div>
        <div class="content-area">
            <div class="content" id="content">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        // Course structure
        const courseStructure = [
            {
                title: "The Basics",
                items: [
                    { name: "NLP - Home page", path: "1 2 3 4 The Basics/1 NLP - Home page.md" },
                    { name: "Elements of Linguistics", path: "1 2 3 4 The Basics/2 Elements of Linguistics.md" },
                    { name: "Learning Tasks & Data Collection", path: "1 2 3 4 The Basics/3 Learning Tasks, Pre-processing and Data Collection.md" },
                    { name: "Text Processing", path: "1 2 3 4 The Basics/4 Text-Processing.md" }
                ]
            },
            {
                title: "Representation",
                items: [
                    { name: "Bag-of-Words & TF-IDF", path: "5 Representation/5 - 1 Simple Text Representations (Bag-of-Words and TF-IDF).md" },
                    { name: "Distributional Semantics", path: "5 Representation/5 - 2 Distributional Semantics and Matrix representations.md" },
                    { name: "Word Embeddings", path: "5 Representation/5 - 3 Word Embeddings.md" },
                    { name: "Sentence & Document Embeddings", path: "5 Representation/5 - 4 Sentence and Document Embeddings.md" }
                ]
            },
            {
                title: "Language Models",
                items: [
                    { name: "Introduction to Language Models", path: "6 Language Models/6 - 1 Introduction to Language Models.md" },
                    { name: "N-Gram Language Model", path: "6 Language Models/6 - 2 N-Gram Language Model.md" },
                    { name: "Feed-forward Networks", path: "6 Language Models/6 - 3 Neural Models - Introducing the Feed-forward Network for language.md" },
                    { name: "RNNs and LSTMs", path: "6 Language Models/6 - 4 Sequence Modelling  - RNNs and LSTMs.md" },
                    { name: "Encoder Decoders", path: "6 Language Models/6 - 5 Encoder Decoders.md" },
                    { name: "Attention and Transformers", path: "6 Language Models/6 - 6 Attention and Transformers.md" },
                    { name: "BERT and Masked LLMs", path: "6 Language Models/6 - 7 BERT and Masked LLMs.md" },
                    { name: "GPT and Generative Models", path: "6 Language Models/6 - 8 Generative Models (Decoder Only), Prompts and GPT.md" },
                    { name: "LLM Evaluation & Scaling Laws", path: "6 Language Models/6 - 9 LLM Evaluation and Scaling Laws.md" }
                ]
            },
            {
                title: "Applications",
                items: [
                    { name: "Coreference Resolution", path: "7 Applications/Coreference Resolution.md" },
                    { name: "Discourse Coherence", path: "7 Applications/Discourse Coherence.md" },
                    { name: "Information Retrieval & RAG", path: "7 Applications/Information Retrieval and Retrieval-Augmented Generation (RAG).md" },
                    { name: "Parsing", path: "7 Applications/Parsing.md" },
                    { name: "Question Answering", path: "7 Applications/Question Answering.md" },
                    { name: "Semantic Role Labelling", path: "7 Applications/Semantic Role Labelling (SRL).md" },
                    { name: "Sentiment Analysis", path: "7 Applications/Sentiment Analysis.md" },
                    { name: "Sequence Labelling", path: "7 Applications/Sequence Labelling.md" }
                ]
            }
        ];

        // Populate navigation
        const nav = document.getElementById('navigation');
        courseStructure.forEach(section => {
            const sectionDiv = document.createElement('div');
            const heading = document.createElement('h3');
            heading.textContent = section.title;
            sectionDiv.appendChild(heading);

            const ul = document.createElement('ul');
            section.items.forEach(item => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = '#';
                a.textContent = item.name;
                a.dataset.path = item.path;
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    loadMarkdown(item.path, item.name);
                });
                li.appendChild(a);
                ul.appendChild(li);
            });
            sectionDiv.appendChild(ul);
            nav.appendChild(sectionDiv);
        });

        // Configure marked
        marked.setOptions({
            breaks: true,
            gfm: true,
            headerIds: true,
            mangle: false
        });

        // Load markdown file
        async function loadMarkdown(path, title) {
            const content = document.getElementById('content');
            const breadcrumb = document.getElementById('breadcrumb');
            
            content.innerHTML = '<div class="loading">Loading...</div>';
            breadcrumb.textContent = title;

            // Update active link
            document.querySelectorAll('.nav-section a').forEach(a => a.classList.remove('active'));
            document.querySelector(`[data-path="${path}"]`)?.classList.add('active');

            try {
                const response = await fetch(path);
                if (!response.ok) throw new Error('File not found');
                
                let markdown = await response.text();
                
                // Convert Obsidian wikilinks [[Page Name]] to regular links
                markdown = markdown.replace(/\[\[([^\]]+)\]\]/g, (match, p1) => {
                    return `[${p1}](#)`;
                });
                
                // Render markdown
                content.innerHTML = marked.parse(markdown);
                
                // Render math equations
                renderMath();
                
                // Close sidebar on mobile
                if (window.innerWidth <= 768) {
                    document.getElementById('sidebar').classList.remove('open');
                }
                
                // Scroll to top
                document.querySelector('.content-area').scrollTop = 0;
            } catch (error) {
                content.innerHTML = `<div class="loading">Error loading content: ${error.message}</div>`;
            }
        }

        // Render KaTeX math
        function renderMath() {
            const content = document.getElementById('content');
            
            // Render block math $$...$$
            content.innerHTML = content.innerHTML.replace(/\$\$([^\$]+)\$\$/g, (match, p1) => {
                try {
                    return katex.renderToString(p1, { displayMode: true, throwOnError: false });
                } catch (e) {
                    return match;
                }
            });
            
            // Render inline math $...$
            content.innerHTML = content.innerHTML.replace(/\$([^\$]+)\$/g, (match, p1) => {
                try {
                    return katex.renderToString(p1, { displayMode: false, throwOnError: false });
                } catch (e) {
                    return match;
                }
            });
        }

        // Load home page
        function loadHome() {
            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="home-intro">
                    <h1>Natural Language Processing</h1>
                    <p>Comprehensive Course Notes</p>
                    <p style="margin-top: 10px; opacity: 0.9; font-size: 0.95em;">University of Padova • Mathematics Department • 2026</p>
                </div>
                
                <p><strong>Welcome!</strong> These comprehensive notes cover the Natural Language Processing course offered at the University of Padova. The material synthesizes lecture content, textbook references, and additional research to provide a complete reference for students and NLP enthusiasts.</p>
                
                <div class="info-grid">
                    <div class="info-card">
                        <h3>📚 Course Info</h3>
                        <p><strong>Instructor:</strong> Giovanni Da San Martino<br>
                        <strong>Author:</strong> Tharen Emmanuel Candi</p>
                    </div>
                    <div class="info-card">
                        <h3>📖 References</h3>
                        <p>Jurafsky & Martin - Speech and Language Processing<br>
                        Jacob Eisenstein - Natural Language Processing</p>
                    </div>
                </div>
                
                <h2>Getting Started</h2>
                <p>Use the sidebar navigation to browse through the course content. Topics are organized into four main sections:</p>
                <ul>
                    <li><strong>The Basics</strong> - Introduction to NLP, linguistics, and text processing</li>
                    <li><strong>Representation</strong> - From bag-of-words to embeddings</li>
                    <li><strong>Language Models</strong> - N-grams to transformers and LLMs</li>
                    <li><strong>Applications</strong> - Real-world NLP tasks and solutions</li>
                </ul>
                
                <p style="margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 6px;">
                    💡 <strong>Tip:</strong> These notes are written in Markdown and rendered dynamically. Click any topic in the sidebar to start exploring!
                </p>
            `;
        }

        // Menu toggle for mobile
        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
        });

        // Load home page on start
        loadHome();
    </script>
</body>
</html>
